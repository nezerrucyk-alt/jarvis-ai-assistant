name: Cross-platform release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  desktop:
    name: Build desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-22.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk portaudio19-dev libportaudio2 libasound2-dev scrot
      - name: Install macOS audio library
        if: runner.os == 'macOS'
        run: brew install portaudio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and packager
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name JARVIS --icon assets/jarvis.ico --add-data "assets;assets" --collect-all edge_tts --collect-all pygame --collect-all speech_recognition --collect-all pyttsx3 --collect-all cryptography --collect-all psutil --collect-all pycaw --collect-all comtypes --collect-all pystray --hidden-import PIL.Image --hidden-import pystray._win32 --hidden-import modules.mobile_bridge --hidden-import modules.coding_workspace --hidden-import modules.voice.offline jarvis.py
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/JARVIS.exe release/JARVIS-Windows.exe
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name JARVIS --add-data "assets:assets" --collect-all edge_tts --collect-all pygame --collect-all speech_recognition --collect-all pyttsx3 jarvis.py
          mkdir -p release
          if [ "${{ matrix.artifact }}" = "macos-intel" ]; then
            ASSET="JARVIS-macOS-Intel.zip"
          else
            ASSET="JARVIS-macOS.zip"
          fi
          ditto -c -k --sequesterRsrc --keepParent dist/JARVIS.app "release/$ASSET"
      - name: Build Linux app
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name JARVIS --add-data "assets:assets" --collect-all edge_tts --collect-all pygame --collect-all speech_recognition --collect-all pyttsx3 jarvis.py
          mkdir -p release
          tar -czf release/JARVIS-Linux.tar.gz -C dist JARVIS
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  desktop-intel:
    name: Build desktop (macOS Intel, optional)
    # macos-13 may be retired; Intel must never block the required builds.
    continue-on-error: true
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Install macOS audio library
        run: brew install portaudio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and packager
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build macOS app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name JARVIS --add-data "assets:assets" --collect-all edge_tts --collect-all pygame --collect-all speech_recognition --collect-all pyttsx3 jarvis.py
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/JARVIS.app "release/JARVIS-macOS-Intel.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-intel
          path: release/*
          if-no-files-found: error

  android:
    name: Build Android APK (experimental)
    runs-on: ubuntu-22.04
    # The APK is experimental and must not block the desktop release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          sudo apt-get install -y libtinfo5 || sudo apt-get install -y libtinfo6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Buildozer
        run: python -m pip install --upgrade buildozer "Cython==0.29.36"
      - name: Build APK
        working-directory: android
        run: buildozer --verbose android debug
      - name: Stage Android release
        run: |
          mkdir -p release
          find android/bin -maxdepth 1 -type f -name "*.apk" -exec cp {} release/JARVIS-Android.apk \;
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/JARVIS-Android.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.desktop.result == 'success'
    # Only the required desktop matrix gates publishing. Android and Intel
    # macOS are experimental/optional and must never hold a release hostage.
    needs: [desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*
