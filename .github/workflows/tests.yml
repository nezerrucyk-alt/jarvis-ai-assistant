name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            experimental: false
          - os: macos-latest
            experimental: true
          - os: ubuntu-22.04
            experimental: true
    runs-on: ${{ matrix.os }}
    # Windows is the primary target and must stay green.
    # macOS/Linux run in advisory mode until the platform-specific tests are fixed.
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI and audio libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb portaudio19-dev libportaudio2 libasound2-dev scrot

      - name: Install macOS audio library
        if: runner.os == 'macOS'
        run: brew install portaudio

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v

      - name: Run unit tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit requirements
        run: pip-audit -r requirements.txt --strict

  website:
    name: Website syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: node --check website/assets/app.js
      - name: Validate workflow YAML
        run: |
          for file in .github/workflows/*.yml .github/dependabot.yml; do
            ruby -ryaml -e 'YAML.load_file(ARGV[0])' "$file"
          done
