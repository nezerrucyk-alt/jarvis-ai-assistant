name: Publish download site

on:
  push:
    branches: [main, master]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
        id: pages
      - name: Prepare website links
        env:
          REPOSITORY: ${{ github.repository }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          replacements = {
              "__GITHUB_REPOSITORY__": os.environ["REPOSITORY"],
              "__SITE_URL__": os.environ["SITE_URL"].rstrip("/"),
          }
          for path in Path("website").rglob("*"):
              if path.suffix.lower() not in {".html", ".xml", ".txt"}:
                  continue
              text = path.read_text(encoding="utf-8")
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
